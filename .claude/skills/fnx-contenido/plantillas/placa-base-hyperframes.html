<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1350" />
<script src="gsap.min.js"></script>
<style>
:root{--negro:#0B0B0B;--grafito:#1C1C1C;--crema:#F3EEE4;--area:#F2552C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--negro)}
#root{position:relative;width:100%;height:100%;font-family:sans-serif}
#cam{position:absolute;inset:0;transform-origin:50% 55%}
.firma{position:absolute;left:72px;top:72px;color:var(--crema);font:italic 52px serif}
.tit{position:absolute;left:72px;top:240px;color:var(--crema);font:900 120px/1 Impact,sans-serif;text-transform:uppercase}
.tit b{color:var(--area);font-weight:900}
.fila{position:absolute;left:0;right:0;top:760px;display:flex;justify-content:center;gap:40px}
.o{width:130px;height:130px;border-radius:50%;background:var(--grafito);border:3px solid #2a2a2a}
.o.on{background:rgba(242,85,44,.12);border:4px solid var(--area);box-shadow:0 0 40px var(--area),inset 0 0 30px rgba(242,85,44,.5)}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1350">
 <div id="cam" class="clip" data-start="0" data-duration="4" data-track-index="0">
  <div class="firma">Fnx</div>
  <div class="tit">Prueba de<br><b>motor</b></div>
  <div class="fila"><div class="o"></div><div class="o"></div><div class="o on"></div><div class="o"></div><div class="o"></div></div>
 </div>
</div>
<script>
const tl = gsap.timeline({paused:true});
tl.to("#cam",{scale:1.06,duration:2,ease:"sine.inOut"},0).to("#cam",{scale:1,duration:2,ease:"sine.inOut"},2);
tl.to(".o.on",{y:-30,duration:1,ease:"power2.out"},0.5).to(".o.on",{y:0,duration:1.2,ease:"power3.inOut"},1.8);
window.__timelines["main"]=tl; tl.seek(0);
</script>
</body>
</html>
